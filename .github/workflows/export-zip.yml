name: Export Destrave ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Destrave-atual-2026-09-20
          path: |
            .
            !.git
            !.github
          include-hidden-files: true
          retention-days: 1
